# Cabeçalhos comuns ao repassar requisições para o backend.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;                  # com a porta: o app confere Origin x Host nos POSTs
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;     # sobrescreve (não acrescenta): o nginx é o único proxy, o cliente não pode forjar o IP
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;                           # leitura de PDFs grandes
proxy_redirect off;
